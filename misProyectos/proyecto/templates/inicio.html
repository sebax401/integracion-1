<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
</head>
<body>
    <!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#">Ferramax</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#">Inicio de Sesión</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="carrito.html">Carrito</a>
          </li>
        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Buscar productos" aria-label="Buscar">
          <button class="btn btn-outline-dark" type="submit">Buscar</button>
        </form>
      </div>
    </div>
  </nav>
  
  <!-- Carrusel -->
  <div id="carouselFerramax" class="carousel slide mt-4" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://www.pmgchile.com/wp-content/uploads/2018/08/shutterstock_710141932baja.jpg" class="d-block w-50" alt="Herramientas">
      </div>
      <div class="carousel-item">
        <img src="https://via.placeholder.com/1200x400?text=Todo+para+tu+proyecto" class="d-block w-50" alt="Proyectos">
      </div>
      <div class="carousel-item">
        <img src="https://via.placeholder.com/1200x400?text=Promociones+Especiales" class="d-block w-100" alt="Promociones">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselFerramax" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselFerramax" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
  
  <!-- Productos -->
  <div class="container mt-5">
    <h2 class="mb-4">Nuestros Productos</h2>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="product-card text-center">
          <img src="https://via.placeholder.com/150" class="img-fluid mb-2" alt="Producto 1">
          <h5>Taladro Eléctrico</h5>
          <p>$39.990</p>
          <button class="btn btn-sm btn-dark">Agregar al carrito</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="product-card text-center">
          <img src="https://via.placeholder.com/150" class="img-fluid mb-2" alt="Producto 2">
          <h5>Caja de Herramientas</h5>
          <p>$24.990</p>
          <button class="btn btn-sm btn-dark">Agregar al carrito</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="product-card text-center">
          <img src="https://via.placeholder.com/150" class="img-fluid mb-2" alt="Producto 3">
          <h5>Llave Inglesa</h5>
          <p>$9.990</p>
          <button class="btn btn-sm btn-dark">Agregar al carrito</button>
        </div>
      </div>
    </div>
  </div>
  
</body>
</html>
